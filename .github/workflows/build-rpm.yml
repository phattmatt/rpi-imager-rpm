name: Build RPM

on:
  push:
    branches: [main]
    tags: [rpm-v*]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version to build. Leave blank to use the spec.
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Script and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-rpm shellcheck
      - run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          shellcheck scripts/*.sh
          git diff --check
      - name: Check workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  rpm:
    name: Fedora 44 x86_64 RPM
    needs: checks
    runs-on: ubuntu-latest
    container: fedora:44
    outputs:
      prerelease: ${{ steps.release_meta.outputs.prerelease }}
      release_name: ${{ steps.release_meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install RPM build tooling
        run: dnf -y install dnf-plugins-core git python3 python3-rpm rpm-build rpmdevtools
      - name: Apply manual version input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          UPSTREAM_VERSION: ${{ inputs.version }}
        run: python3 scripts/update-version.py --version "$UPSTREAM_VERSION" --packager "GitHub Actions <actions@github.com>"
      - name: Install declared build dependencies
        run: dnf -y builddep ./rpi-imager.spec
      - name: Build source and binary RPMs
        run: bash scripts/build-rpm.sh
      - name: Upload RPM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpi-imager-rpms
          if-no-files-found: error
          path: |
            .rpmbuild/RPMS/**/*.rpm
            .rpmbuild/SRPMS/*.rpm
      - name: Validate tag and prepare release
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/rpm-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          rpm_path="$(python3 scripts/select-rpm.py .rpmbuild/RPMS)"
          python3 scripts/prepare-release.py --tag "$RELEASE_TAG" --rpm "$rpm_path"
      - name: Upload validated release files
        if: startsWith(github.ref, 'refs/tags/rpm-v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  install:
    name: Clean Fedora 44 installation and startup
    needs: rpm
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpi-imager-rpms
          path: artifacts
      - run: dnf -y --setopt=install_weak_deps=False install python3 rpm
      - run: bash scripts/smoke-test-rpm.sh artifacts/RPMS
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-logs
          path: /tmp/rpi-imager-*.log
          if-no-files-found: ignore

  publish:
    name: Publish validated release
    if: startsWith(github.ref, 'refs/tags/rpm-v')
    needs: [rpm, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.rpm.outputs.release_name }}
          prerelease: ${{ needs.rpm.outputs.prerelease == 'true' }}
          body_path: release/notes.md
          files: release/*.rpm
          fail_on_unmatched_files: true
